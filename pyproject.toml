[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillkit"
version = "1.0.0"
description = "The toolbox for AI agent skills: scaffold, lint, pack, install, and serve SKILL.md skills with a built-in MCP server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "ai-agents", "skills", "claude", "llm", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.scripts]
skillkit = "skillkit.cli:main"

[tool.setuptools.packages.find]
include = ["skillkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
